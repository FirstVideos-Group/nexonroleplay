<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css"/>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div id="hud-root">

        <!-- ══ Alap stat bar-ok (health, armor, hunger, thirst) ══════════
             Kozos panel hatterrel – illeszkedik a vehicle-hud stilusához -->
        <div class="hud-module hud-bars-panel" id="panel-main" data-order="1">

            <!-- Health -->
            <div class="hud-bar-row" data-module="health">
                <i class="hgi hgi-stroke hgi-heart-01 hud-icon icon-health"></i>
                <div class="hud-track">
                    <div class="hud-fill fill-health" id="bar-health" style="width:100%"></div>
                </div>
                <span class="hud-val" id="val-health">100</span>
            </div>

            <!-- Armor -->
            <div class="hud-bar-row" data-module="armor">
                <i class="hgi hgi-stroke hgi-shield-01 hud-icon icon-armor"></i>
                <div class="hud-track">
                    <div class="hud-fill fill-armor" id="bar-armor" style="width:0%"></div>
                </div>
                <span class="hud-val" id="val-armor">0</span>
            </div>

            <div class="hud-panel-divider"></div>

            <!-- Hunger -->
            <div class="hud-bar-row" data-module="hunger">
                <i class="hgi hgi-stroke hgi-hamburger-01 hud-icon icon-hunger"></i>
                <div class="hud-track">
                    <div class="hud-fill fill-hunger" id="bar-hunger" style="width:100%"></div>
                </div>
                <span class="hud-val" id="val-hunger">100</span>
            </div>

            <!-- Thirst -->
            <div class="hud-bar-row" data-module="thirst">
                <i class="hgi hgi-stroke hgi-water-polo hud-icon icon-thirst"></i>
                <div class="hud-track">
                    <div class="hud-fill fill-thirst" id="bar-thirst" style="width:100%"></div>
                </div>
                <span class="hud-val" id="val-thirst">100</span>
            </div>

        </div>
        <!-- /panel-main -->

        <!-- ══ Ideiglenes bar-ok (stamina, oxygen, stress) ═════════════
             Kozos panel, csak akkor latszik ha van aktiv bar -->
        <div class="hud-module hud-bars-panel hud-module--temporary" id="panel-temp" data-order="2" style="display:none">

            <!-- Stamina -->
            <div class="hud-bar-row" data-module="stamina" id="row-stamina" style="display:none">
                <i class="hgi hgi-stroke hgi-lightning-01 hud-icon icon-stamina"></i>
                <div class="hud-track">
                    <div class="hud-fill fill-stamina" id="bar-stamina" style="width:100%"></div>
                </div>
                <span class="hud-val" id="val-stamina">100</span>
            </div>

            <!-- Oxygen -->
            <div class="hud-bar-row" data-module="oxygen" id="row-oxygen" style="display:none">
                <i class="hgi hgi-stroke hgi-bubble-chat-01 hud-icon icon-oxygen"></i>
                <div class="hud-track">
                    <div class="hud-fill fill-oxygen" id="bar-oxygen" style="width:100%"></div>
                </div>
                <span class="hud-val" id="val-oxygen">100</span>
            </div>

            <!-- Stress -->
            <div class="hud-bar-row" data-module="stress" id="row-stress" style="display:none">
                <i class="hgi hgi-stroke hgi-brain hud-icon icon-stress"></i>
                <div class="hud-track">
                    <div class="hud-fill fill-stress" id="bar-stress" style="width:0%"></div>
                </div>
                <span class="hud-val" id="val-stress">0</span>
            </div>

        </div>
        <!-- /panel-temp -->

        <!-- ══ Badge modulok ════════════════════════════════════════ -->

        <!-- Money -->
        <div class="hud-module hud-module--badge" data-module="money" data-order="3" style="display:none">
            <i class="hgi hgi-stroke hgi-money-bag-01 hud-icon icon-money"></i>
            <span class="hud-badge-val" id="val-money">$0</span>
        </div>

        <!-- Job -->
        <div class="hud-module hud-module--badge" data-module="job" data-order="4" style="display:none">
            <i class="hgi hgi-stroke hgi-briefcase-01 hud-icon icon-job"></i>
            <span class="hud-badge-val" id="val-job">N/A</span>
        </div>

        <!-- Player ID -->
        <div class="hud-module hud-module--badge" data-module="playerid" data-order="5" style="display:none">
            <i class="hgi hgi-stroke hgi-id-verified hud-icon icon-id"></i>
            <span class="hud-badge-val" id="val-playerid">#0</span>
        </div>

        <!-- Datetime -->
        <div class="hud-module hud-module--badge" data-module="datetime" data-order="6" style="display:none">
            <i class="hgi hgi-stroke hgi-clock-01 hud-icon icon-datetime"></i>
            <span class="hud-badge-val" id="val-datetime">--:--</span>
        </div>

    </div>
    <script src="app.js"></script>
</body>
</html>
