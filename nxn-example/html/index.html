<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>nxn-example</title>
    <link rel="stylesheet" href="https://use.hugeicons.com/font/icons.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Értesítés konténer -->
<div id="notify-container"></div>

<!-- Főpanel -->
<div id="nxn-panel" class="nxn-panel hidden">
    <div class="nxn-panel__header">
        <span><i class="hgi hgi-stroke hgi-home-01"></i> nxn-example</span>
        <button id="btn-close" class="nxn-btn-icon">
            <i class="hgi hgi-stroke hgi-cancel-01"></i>
        </button>
    </div>
    <div class="nxn-panel__body">
        <p class="nxn-label">Ez egy Nexon boilerplate panel.</p>
        <button class="nxn-btn" id="btn-action">
            <i class="hgi hgi-stroke hgi-play"></i> Akció indítása
        </button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
